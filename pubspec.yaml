name: vendi
description: Vendi — a modern multi-vendor marketplace app.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.0.0
  provider: ^6.1.0
  shared_preferences: ^2.2.0
  google_fonts: ^6.2.0
  cached_network_image: ^3.3.0
  fl_chart: ^0.68.0
  intl: ^0.19.0
  flutter_animate: ^4.5.0
  carousel_slider: ^5.0.0
  http: ^1.2.0
  supabase_flutter: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

# Transitive dep pulled in by supabase_flutter 1.x. The locked 5.0.0 fails to
# compile on Android (references the removed v1-embedding `Registrar` API).
# Not used in app code; override to a version that supports v2 embedding.
dependency_overrides:
  sign_in_with_apple: ^6.1.4

flutter:
  uses-material-design: true
